name: amt-pricelist
x-app-environment: &app-environment
  DATABASE_URL: postgresql://${POSTGRES_USER:?Set POSTGRES_USER}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@/${POSTGRES_DB:?Set POSTGRES_DB}?host=%2Fvar%2Frun%2Fpostgresql
  NODE_ENV: production
  APP_ORIGIN: ${APP_ORIGIN:?Set APP_ORIGIN}
  COOKIE_SECURE: ${COOKIE_SECURE:-false}
  APP_BASE_PATH: /amt_price_list
  APP_RELEASE: ${APP_RELEASE:-local}
  SETUP_TOKEN: ${SETUP_TOKEN:?Generate SETUP_TOKEN}
  AI_SECRET_ENCRYPTION_KEY: ${AI_SECRET_ENCRYPTION_KEY:?Generate AI_SECRET_ENCRYPTION_KEY}
  OPENAI_PRODUCT_MODEL: ${OPENAI_PRODUCT_MODEL:-gpt-5.4-nano}
  PUBLIC_URL: ${PUBLIC_URL:-}
  MOYASAR_PUBLISHABLE_KEY: ${MOYASAR_PUBLISHABLE_KEY:-}
  MOYASAR_SECRET_KEY: ${MOYASAR_SECRET_KEY:-}
  OTP_PROVIDER_URL: ${OTP_PROVIDER_URL:-}
  OTP_PROVIDER_TOKEN: ${OTP_PROVIDER_TOKEN:-}
  COMMERCE_NOTIFICATION_URL: ${COMMERCE_NOTIFICATION_URL:-}
  COMMERCE_NOTIFICATION_TOKEN: ${COMMERCE_NOTIFICATION_TOKEN:-}
  WHATSAPP_SERVICE_URL: http://whatsapp:3010
  WHATSAPP_SERVICE_TOKEN: ${WHATSAPP_SERVICE_TOKEN:-}
  UPLOAD_DIR: /data/uploads
  BACKUP_DIR: /data/backups
  DB_HOST: ${DB_HOST:-127.0.0.1}
  DB_PORT: ${DB_PORT:-15432}
  PDF_MAX_PAGES: ${PDF_MAX_PAGES:-100}
  UPLOAD_MAX_MB: ${UPLOAD_MAX_MB:-20}
services:
  whatsapp:
    image: localhost/amt-pricelist-whatsapp:${AMT_RELEASE_TAG:-local}
    build: { context: ., target: whatsapp }
    profiles: [whatsapp]
    restart: unless-stopped
    environment:
      WHATSAPP_SERVICE_TOKEN: ${WHATSAPP_SERVICE_TOKEN:-}
      WHATSAPP_SESSION_DIR: /data/whatsapp
      WHATSAPP_BIND_HOST: 0.0.0.0
      WHATSAPP_NO_SANDBOX: "true"
    volumes: [whatsapp_session:/data/whatsapp]
    networks: [private, whatsapp_outbound]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    mem_limit: 1024m
    pids_limit: 256
    shm_size: 256m
    logging:
      driver: json-file
      options: { max-size: 10m, max-file: "3" }
  db:
    image: docker.io/library/postgres:17-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB}
    command:
      [postgres, -c, listen_addresses=*, -c, hba_file=/etc/postgresql/amt-pg_hba.conf, -c, unix_socket_directories=/var/run/postgresql, -c, unix_socket_permissions=0777]
    volumes:
      - database:/var/lib/postgresql/data
      - database_socket:/var/run/postgresql
      - ./docker/pg_hba.conf:/etc/postgresql/amt-pg_hba.conf:ro
    ports: ["127.0.0.1:${DB_PORT:-15432}:5432"]
    networks: [private]
    healthcheck:
      test:
        [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 10s
      timeout: 5s
      retries: 10
    mem_limit: 512m
    cpus: 1.0
    logging: &logging
      driver: json-file
      options: { max-size: 10m, max-file: "3" }
  migrate:
    mem_limit: 512m
    image: localhost/amt-pricelist-app:${AMT_RELEASE_TAG:-local}
    build: { context: ., target: app }
    environment: *app-environment
    command: [pnpm, migrate]
    depends_on: { db: { condition: service_healthy } }
    networks: [private]
    volumes: [database_socket:/var/run/postgresql:ro]
    restart: "no"
    logging: *logging
  app:
    image: localhost/amt-pricelist-app:${AMT_RELEASE_TAG:-local}
    build: { context: ., target: app }
    restart: unless-stopped
    environment: *app-environment
    ports: ["127.0.0.1:${APP_PORT:-18180}:3000"]
    volumes:
      - uploads:/data/uploads
      - database_socket:/var/run/postgresql:ro
    networks: [private, commerce_outbound]
    depends_on: { migrate: { condition: service_completed_successfully } }
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    mem_limit: 768m
    cpus: 1.0
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          "fetch('http://127.0.0.1:3000/amt_price_list/api/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
    logging: *logging
  worker:
    image: localhost/amt-pricelist-worker:${AMT_RELEASE_TAG:-local}
    build: { context: ., target: worker }
    restart: unless-stopped
    environment: *app-environment
    volumes:
      - uploads:/data/uploads
      - database_socket:/var/run/postgresql:ro
    networks: [private, commerce_outbound]
    depends_on: { migrate: { condition: service_completed_successfully } }
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    mem_limit: 1024m
    cpus: 0.75
    pids_limit: 160
    tmpfs: ["/tmp:size=256m,mode=1777"]
    logging: *logging
  backup:
    image: localhost/amt-pricelist-backup:${AMT_RELEASE_TAG:-local}
    build: { context: ., target: backup }
    restart: unless-stopped
    environment: *app-environment
    volumes:
      - backups:/data/backups
      - database_socket:/var/run/postgresql:ro
    networks: [private]
    depends_on: { migrate: { condition: service_completed_successfully } }
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    mem_limit: 256m
    cpus: 0.25
    logging: *logging
networks:
  commerce_outbound: {}
  whatsapp_outbound: {}
  private:
    internal: true
volumes:
  whatsapp_session:
  database:
  database_socket:
  uploads:
  backups:
